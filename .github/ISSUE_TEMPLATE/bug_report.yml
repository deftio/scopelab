name: Bug report
description: Something in ScopeLab doesn't work the way the README says it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing. If your **camera isn't detected at all**, please check
        the [troubleshooting guide](https://github.com/deftio/scopelab#troubleshooting)
        first: the browser can only see cameras the operating system sees.

        If this is a **security** problem, please do not file it here. See
        [SECURITY.md](https://github.com/deftio/scopelab/blob/main/SECURITY.md).

  - type: dropdown
    id: where
    attributes:
      label: How are you running it?
      options:
        - Hosted site (deftio.github.io/scopelab)
        - npm start
        - npm run dev
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: "Chrome 141 on macOS 26.1 (Apple silicon)"
    validations:
      required: true

  - type: input
    id: camera
    attributes:
      label: Camera
      description: Name as shown in the Camera tab, and the USB id from the USB tab if you have it.
      placeholder: "USB2.0 Camera (1908:2310), 1280×720"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Including which filters were in the chain and their settings, if relevant.
      placeholder: |
        1. Start camera at 1280×720
        2. Add Canny, turn on overlay
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: A screenshot, and any errors from the browser console (View → Developer → JavaScript Console), help a lot.
    validations:
      required: true
