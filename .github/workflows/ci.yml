# Minimal CI: install, syntax-check, run the filter tests, build the Pages site.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check server.js && node --check public/app.js && node --check public/filters.js
      - run: npm test
      - run: npm run build:pages
